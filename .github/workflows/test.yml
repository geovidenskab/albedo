name: Test Albedo Calculator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Start local server
      run: |
        python3 -m http.server 8000 &
        sleep 5
    
    - name: Run basic tests
      run: |
        # Test at alle filer eksisterer
        test -f index.html
        test -f css/styles.css
        test -f js/app.js
        test -f js/canvas.js
        test -f js/calculations.js
        test -f js/export.js
        test -f README.md
        test -f package.json
        
        echo "All required files exist"
    
    - name: Validate HTML
      run: |
        # Simpel HTML validering
        grep -q "<!DOCTYPE html>" index.html
        grep -q "<title>" index.html
        grep -q "</html>" index.html
        echo "HTML structure looks good"
    
    - name: Check JavaScript syntax
      run: |
        # Tjek JavaScript syntaks
        node -c js/app.js
        node -c js/canvas.js
        node -c js/calculations.js
        node -c js/export.js
        echo "JavaScript syntax is valid"
